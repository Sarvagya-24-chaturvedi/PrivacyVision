name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd extension
          npm ci

      - name: Build Chrome Extension (Manifest V3)
        run: |
          cd extension
          npm run build

      - name: Package Extension ZIP
        run: |
          cd extension/dist
          zip -r ../../privacyvision-extension.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: privacyvision-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
